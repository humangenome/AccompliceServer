name: Feature request
description: Suggest a new capability or behaviour for Accomplice
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: usecase
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not the solution. What does Accomplice not let you do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: What workaround exists, and why is it not good enough?

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmations
      options:
        - label: I've searched existing issues for the same idea
          required: true
